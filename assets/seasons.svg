            d="M -20 185
               Q 60 177 140 185
               Q 220 193 300 185
               Q 380 177 460 185
               Q 540 193 620 185
               L 820 185
               L 820 220
               L -20 220 Z"
            fill="#1976d2"
            opacity="0.9"
        >
            <animate
                attributeName="d"
                values="M -20 185 Q 60 177 140 185 Q 220 193 300 185 Q 380 177 460 185 Q 540 193 620 185 L 820 185 L 820 220 L -20 220 Z;
                       M -20 185 Q 60 193 140 185 Q 220 177 300 185 Q 380 193 460 185 Q 540 177 620 185 L 820 185 L 820 220 L -20 220 Z;
                       M -20 185 Q 60 177 140 185 Q 220 193 300 185 Q 380 177 460 185 Q 540 193 620 185 L 820 185 L 820 220 L -20 220 Z"
                dur="2.0s"
                begin="1.0s"
                repeatCount="indefinite"
            />
        </path>
        <path
            id="wave-layer-3"
            d="M -20 190
               Q 60 182 140 190
               Q 220 198 300 190
               Q 380 182 460 190
               Q 540 198 620 190
               L 820 190
               L 820 220
               L -20 220 Z"
            fill="#42a5f5"
            opacity="0.9"
        >
            <animate
                attributeName="d"
                values="M -20 190 Q 60 182 140 190 Q 220 198 300 190 Q 380 182 460 190 Q 540 198 620 190 L 820 190 L 820 220 L -20 220 Z;
                       M -20 190 Q 60 198 140 190 Q 220 182 300 190 Q 380 198 460 190 Q 540 182 620 190 L 820 190 L 820 220 L -20 220 Z;
                       M -20 190 Q 60 182 140 190 Q 220 198 300 190 Q 380 182 460 190 Q 540 198 620 190 L 820 190 L 820 220 L -20 220 Z"
                dur="2.0s"
                begin="1.5s"
                repeatCount="indefinite"
            />
        </path>
