<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 200"
    width="800"
    height="200"
>


    <g id="sun">
        <!-- Sun glow -->
        <circle cx="680.0" cy="35" r="45" fill="#fff9c4" opacity="0.3">
            <animate
                attributeName="r"
                values="40;50;40"
                dur="3s"
                repeatCount="indefinite"
            />
            <animate
                attributeName="opacity"
                values="0.3;0.5;0.3"
                dur="3s"
                repeatCount="indefinite"
            />
        </circle>
        <circle cx="680.0" cy="35" r="35" fill="#ffee58" opacity="0.5">
            <animate
                attributeName="r"
                values="33;40;33"
                dur="2.5s"
                repeatCount="indefinite"
            />
        </circle>
        <!-- Sun rays -->
        <g id="sun-rays">
            
            <line
                x1="710.0" y1="35.0"
                x2="725.0" y2="35.0"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="705.9807621135332" y1="50.0"
                x2="718.9711431702997" y2="57.5"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="695.0" y1="60.98076211353316"
                x2="702.5" y2="73.97114317029974"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="680.0" y1="65.0"
                x2="680.0" y2="80.0"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="665.0" y1="60.98076211353316"
                x2="657.5" y2="73.97114317029974"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="654.0192378864668" y1="50.0"
                x2="641.0288568297003" y2="57.5"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="650.0" y1="35.00000000000001"
                x2="635.0" y2="35.00000000000001"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="654.0192378864668" y1="19.999999999999996"
                x2="641.0288568297003" y2="12.499999999999996"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="665.0" y1="9.019237886466847"
                x2="657.5" y2="-3.971143170299726"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="680.0" y1="5.0"
                x2="680.0" y2="-10.0"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="695.0" y1="9.019237886466843"
                x2="702.5" y2="-3.97114317029974"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <line
                x1="705.9807621135332" y1="19.999999999999986"
                x2="718.9711431702997" y2="12.499999999999979"
                stroke="#ffeb3b"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.8"
            />
            <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 680.0 35"
                to="360 680.0 35"
                dur="60s"
                repeatCount="indefinite"
            />
        </g>
        <!-- Sun body -->
        <circle cx="680.0" cy="35" r="25" fill="#ffc107"/>
        <circle cx="680.0" cy="35" r="20" fill="#ffeb3b"/>
    </g>

    <g id="ocean-layer">
        
