    <g id="beach-layer">
        <!-- Main beach -->
        <path
            d="M 0 170
               Q 108.0 165 216.0 175
               Q 288.0 185 360.0 195
               L 390.0 220
               L 0 220 Z"
            fill="#ffe0b2"
        />
        <!-- Beach edge meeting water -->
        <path
            d="M 330.0 190
               Q 360.0 195 380.0 200
               L 380.0 220
               L 330.0 220 Z"
            fill="#ffecb3"
            opacity="0.8"
        />
        
            <circle cx="18.0" cy="184.5" r="1.5" fill="#ffcc80" opacity="0.5"/>
            <circle cx="43.199999999999996" cy="174.0" r="2.0" fill="#ffcc80" opacity="0.5"/>
            <circle cx="28.8" cy="191.5" r="1.2" fill="#ffcc80" opacity="0.5"/>
            <circle cx="72.0" cy="181.0" r="1.8" fill="#ffcc80" opacity="0.5"/>
            <circle cx="54.0" cy="170.5" r="1.0" fill="#ffcc80" opacity="0.5"/>
            <circle cx="90.0" cy="188.0" r="2.2" fill="#ffcc80" opacity="0.5"/>
            <circle cx="108.0" cy="177.5" r="1.5" fill="#ffcc80" opacity="0.5"/>
            <circle cx="64.8" cy="167.0" r="1.3" fill="#ffcc80" opacity="0.5"/>
            <circle cx="125.99999999999999" cy="184.5" r="1.8" fill="#ffcc80" opacity="0.5"/>
            <circle cx="100.80000000000001" cy="174.0" r="2.0" fill="#ffcc80" opacity="0.5"/>
            <circle cx="144.0" cy="181.0" r="1.2" fill="#ffcc80" opacity="0.5"/>
            <circle cx="79.2" cy="191.5" r="1.6" fill="#ffcc80" opacity="0.5"/>
            <circle cx="25.200000000000003" cy="177.5" r="1.4" fill="#ffcc80" opacity="0.5"/>
            <circle cx="118.80000000000001" cy="170.5" r="1.9" fill="#ffcc80" opacity="0.5"/>
            <circle cx="136.8" cy="188.0" r="1.1" fill="#ffcc80" opacity="0.5"/>
    </g>

    <g id="parasol" transform="translate(0, 200)">
        <g transform-origin="120.0px -10px">
            <!-- Pole -->
            <rect
                x="118.0"
                y="-75"
                width="4"
                height="65"
                fill="#8d6e63"
                rx="2"
            />
            <!-- Canopy (umbrella shape with triangles) -->
            <g id="canopy">
                
            <path
                d="M 120.0 -90
                   L 75.0 -75.0
                   L 86.25 -71.93853254107928
                   Z"
                fill="#e53935"
            />
            <path
                d="M 120.0 -90
                   L 86.25 -71.93853254107928
                   L 97.5 -69.34314575050762
                   Z"
                fill="#ffffff"
            />
            <path
                d="M 120.0 -90
                   L 97.5 -69.34314575050762
                   L 108.75 -67.60896373990971
                   Z"
                fill="#e53935"
            />
            <path
                d="M 120.0 -90
                   L 108.75 -67.60896373990971
                   L 120.0 -67.0
                   Z"
                fill="#ffffff"
            />
            <path
                d="M 120.0 -90
                   L 120.0 -67.0
                   L 131.25 -67.60896373990971
                   Z"
                fill="#e53935"
            />
            <path
                d="M 120.0 -90
                   L 131.25 -67.60896373990971
                   L 142.5 -69.34314575050762
                   Z"
                fill="#ffffff"
            />
            <path
                d="M 120.0 -90
                   L 142.5 -69.34314575050762
                   L 153.75 -71.93853254107928
                   Z"
                fill="#e53935"
            />
            <path
                d="M 120.0 -90
                   L 153.75 -71.93853254107928
                   L 165.0 -75.0
                   Z"
                fill="#ffffff"
            />
                <!-- Canopy bottom arc edge -->
                <path
                    d="M 75.0 -75 L 75.0 -75.0 L 80.0 -73.61081457866456 L 85.0 -72.26383885339465 L 90.0 -71.0 L 95.0 -69.85769912250768 L 100.0 -68.87164445504817 L 105.0 -68.07179676972449 L 110.0 -67.48245903371273 L 115.0 -67.12153797590234 L 120.0 -67.0 L 125.0 -67.12153797590234 L 130.0 -67.48245903371273 L 135.0 -68.07179676972449 L 140.0 -68.87164445504817 L 145.0 -69.85769912250768 L 150.0 -71.0 L 155.0 -72.26383885339465 L 160.0 -73.61081457866456 L 165.0 -75.0"
                    fill="none"
                    stroke="#bdbdbd"
                    stroke-width="1.5"
                />
                <!-- Top finial -->
                <circle
                    cx="120.0"
                    cy="-92"
                    r="3"
                    fill="#ffeb3b"
                />
            </g>
            <!-- Gentle sway animation -->
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="-1.5;1.5;-1.5"
                dur="4.0s"
                repeatCount="indefinite"
                keyTimes="0;0.5;1"
                calcMode="spline"
                keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
            />
        </g>
    </g>

</svg>