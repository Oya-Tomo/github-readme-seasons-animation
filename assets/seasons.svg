            <animate
                attributeName="d"
                values="M -20 175 Q 60 167 140 175 Q 220 183 300 175 Q 380 167 460 175 Q 540 183 620 175 L 820 175 L 820 220 L -20 220 Z;
                       M -20 175 Q 60 183 140 175 Q 220 167 300 175 Q 380 183 460 175 Q 540 167 620 175 L 820 175 L 820 220 L -20 220 Z;
                       M -20 175 Q 60 167 140 175 Q 220 183 300 175 Q 380 167 460 175 Q 540 183 620 175 L 820 175 L 820 220 L -20 220 Z"
                dur="2.0s"
                begin="0s"
                repeatCount="indefinite"
            />
        </path>
        <path
            id="wave-layer-1"
            d="M -20 180
               Q 60 172 140 180
               Q 220 188 300 180
               Q 380 172 460 180
               Q 540 188 620 180
               L 820 180
               L 820 220
               L -20 220 Z"
            fill="#1565c0"
            opacity="0.9"
        >
            <animate
                attributeName="d"
                values="M -20 180 Q 60 172 140 180 Q 220 188 300 180 Q 380 172 460 180 Q 540 188 620 180 L 820 180 L 820 220 L -20 220 Z;
                       M -20 180 Q 60 188 140 180 Q 220 172 300 180 Q 380 188 460 180 Q 540 172 620 180 L 820 180 L 820 220 L -20 220 Z;
                       M -20 180 Q 60 172 140 180 Q 220 188 300 180 Q 380 172 460 180 Q 540 188 620 180 L 820 180 L 820 220 L -20 220 Z"
                dur="2.0s"
                begin="0.5s"
                repeatCount="indefinite"
            />
        </path>
        <path
